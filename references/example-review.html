<style>
:root{

  --d-add:rgba(163,190,140,.14);--d-add-num:rgba(163,190,140,.26);--d-del:rgba(224,149,157,.14);--d-del-num:rgba(224,149,157,.28);--d-hunk:rgba(136,192,208,.12);--d-hunk-fg:#88c0d0;--d-num:#6f7a8c;
}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.55 var(--sans)}
button{font:inherit;color:var(--text);background:var(--mask);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--faint)}
button.on{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{margin:4px 0 6px;font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.summary{margin:0;color:var(--muted);max-width:78ch}
.other{margin:6px 0 0;padding-left:16px;color:var(--muted)}
.other:empty{display:none}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);gap:16px;align-items:start}
@media (max-width:960px){main{grid-template-columns:1fr}}
.canvas{position:relative;border:1px solid var(--border);border-radius:12px;padding:52px 24px 44px;overflow:auto;min-height:60vh;background:var(--mask)}
.canvas svg{display:block;max-width:100%;height:auto;margin:0 auto}
.legend{position:absolute;left:20px;bottom:14px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;border:1.5px solid}
.sw.added{border-color:var(--add);background:var(--add-fill)}.sw.modified{border-color:var(--mod);background:var(--mod-fill)}
.sw.removed{border-color:var(--rem);background:var(--rem-fill);border-style:dashed}.sw.unchanged{border-color:var(--unc);background:var(--unc-fill)}
.tools{position:absolute;right:14px;top:12px;display:flex;gap:6px}
/* mermaid nodes: status class lands on the node group */
.node{cursor:pointer}
.node rect,.node path,.node polygon{stroke-width:1.5px!important;filter:none!important}
.node.added rect,.node.added path,.node.added polygon{fill:var(--add-fill)!important;stroke:var(--add)!important}
.node.modified rect,.node.modified path,.node.modified polygon{fill:var(--mod-fill)!important;stroke:var(--mod)!important}
.node.removed rect,.node.removed path,.node.removed polygon{fill:var(--rem-fill)!important;stroke:var(--rem)!important;stroke-dasharray:6 4}
.node.unchanged rect,.node.unchanged path,.node.unchanged polygon{fill:var(--unc-fill)!important;stroke:var(--unc)!important}
.node.sel rect,.node.sel path,.node.sel polygon{stroke-width:2.5px!important}
.node .nodeLabel{color:var(--text)!important}
.node .nodeLabel b{font:600 13px var(--mono)}
.node .nodeLabel small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:3px}
.node.removed .nodeLabel b{color:var(--rem)}
.edgeLabel .label,.edgeLabel p{color:var(--muted)!important;font-size:11px}
/* ==> is only used for added calls, -.-> only for removed ones */
.flowchart-link.edge-thickness-thick{stroke:var(--add)!important}
.flowchart-link.edge-pattern-dotted{stroke:var(--rem)!important}
.node,.node *{filter:none!important}
/* sequence flows: status classes are added to actors and message lines after render */
/* participant boxes stay neutral; the function lines inside carry the status colour */
rect.actor{fill:var(--unc-fill)!important;stroke:var(--unc)!important;stroke-width:1.5px!important;cursor:pointer;filter:none!important}
rect.actor.sel{stroke-width:2.5px!important}
text.actor{pointer-events:none;fill:var(--text)!important}text.actor tspan{font:600 13px var(--mono)}
.messageText{fill:var(--muted)!important;font-size:11px!important}
tspan.fn-added{fill:var(--add)!important}tspan.fn-modified{fill:var(--mod)!important}tspan.fn-removed{fill:var(--rem)!important}tspan.fn-unchanged{fill:var(--muted)!important}
/* wide sequence diagrams scroll sideways instead of shrinking */
#chart{overflow-x:auto}#chart svg[aria-roledescription=sequence]{max-width:none!important;height:auto}
.msg-added{stroke:var(--add)!important;stroke-width:2.5px!important}
.msg-removed{stroke:var(--rem)!important}
/* side panel */
aside{display:flex;flex-direction:column;gap:12px;position:sticky;top:20px}
.card{border:1px solid var(--border);border-radius:12px;background:var(--mask);padding:16px 18px}
.card h2{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:15px;font-weight:600}
.card h2.mono{font-family:var(--mono);font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.dot.added{background:var(--add)}.dot.modified{background:var(--mod)}.dot.removed{background:var(--rem)}.dot.unchanged{background:var(--unc)}
.hint{color:var(--muted);margin:0}
.pill{font-size:11px;font-weight:600;text-transform:lowercase;padding:1px 8px;border-radius:999px;border:1px solid;margin-left:auto}
.pill.added{color:var(--add);border-color:var(--add)}.pill.modified{color:var(--mod);border-color:var(--mod)}.pill.removed{color:var(--rem);border-color:var(--rem)}.pill.unchanged{color:var(--unc);border-color:var(--unc)}
ul.changed{list-style:none;margin:10px 0 0;padding:0}
ul.changed li{display:grid;grid-template-columns:8px 1fr;gap:0 10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--border);cursor:pointer}
ul.changed li:hover strong{color:var(--accent)}
ul.changed strong{font:600 13px var(--mono)}
ul.changed small{grid-column:2;color:var(--muted)}
.file{color:var(--faint);font:12px var(--mono);margin:0 0 10px;word-break:break-all}
.notes{border-left:2px solid var(--mod);padding:6px 12px;margin:12px 0;color:var(--text)}
.notes p{margin:0}.notes p+p{margin-top:6px}
.callers{margin:12px 0 0;color:var(--muted)}.callers code{font:12px var(--mono);color:var(--text)}
.diffwrap{margin:12px 0 0;border:1px solid var(--border);border-radius:8px;overflow:auto;background:var(--mask)}
table.diff{border-collapse:collapse;font:12px/20px var(--mono);min-width:100%}
table.diff td{padding:0;vertical-align:top;white-space:pre}
table.diff td.ln{width:1%;min-width:34px;padding:0 8px;text-align:right;color:var(--d-num);user-select:none}
table.diff td.sign{width:1%;padding:0 4px 0 8px;color:var(--d-num);user-select:none}
table.diff td.code{padding-right:16px;width:100%}
table.diff tr.a td{background:var(--d-add)}table.diff tr.a td.ln{background:var(--d-add-num)}
table.diff tr.d td{background:var(--d-del)}table.diff tr.d td.ln{background:var(--d-del-num)}
table.diff tr.h td{background:var(--d-hunk);color:var(--d-hunk-fg);padding:2px 12px}
table.diff tr.h.x{cursor:pointer}table.diff tr.h.x:hover td{filter:brightness(.95)}
pre.err{margin:0;padding:12px;font:12px/1.5 var(--mono);color:var(--rem);white-space:pre-wrap}
.fn{border-top:1px solid var(--border);margin-top:14px;padding-top:12px}
.fn h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font:600 13px var(--mono)}
.risk{color:var(--rem)!important;font-weight:600;font-size:14px}.risk.medium{color:var(--mod)!important}.risk.low{color:var(--unc)!important}
tspan.risk{fill:var(--rem)!important;font-size:14px!important}tspan.risk.medium{fill:var(--mod)!important}tspan.risk.low{fill:var(--unc)!important}
ol.risks{list-style:none;margin:10px 0 0;padding:0}
ol.risks li{display:grid;grid-template-columns:22px 1fr;gap:0 8px;padding:10px 0;border-top:1px solid var(--border)}
ol.risks .rn{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--rem);color:var(--rem);font:600 11px/17px var(--sans);text-align:center}
ol.risks .rn.medium{border-color:var(--mod);color:var(--mod)}ol.risks .rn.low{border-color:var(--unc);color:var(--unc)}
ol.risks strong{font-weight:600}ol.risks p{grid-column:2;margin:4px 0 0;color:var(--muted)}ol.risks p.fix{color:var(--text)}
.back{display:inline-block;margin-top:12px;color:var(--accent);text-decoration:none}
</style>

<script id="flows" type="application/json">{"title": "PR #412: coupons, idempotent charges, refunds on cancel", "summary": "Adds coupon discounts to order creation, makes charge() idempotent on order id, and refunds the charge when an order is cancelled. Two request flows change: create order and cancel order.", "other": ["Order dataclass gains discount and charge_id fields (shop/orders.py)", "No tests added for apply_coupon, charge idempotency, or refund"], "flows": [{"id": "create-order", "title": "Create order", "description": "POST /orders, called by the checkout page. Promises a saved order that is paid for and has its stock reserved. This PR inserts a coupon step before stock reservation and makes the charge idempotent on the order id.", "nodes": [{"id": "create_order", "label": "POST /orders \u2192 create_order()", "shape": "entry", "status": "modified", "file": "shop/api.py", "line": 7, "change": "applies coupon, stores charge_id, returns discount", "diff": "@@ -7,9 +8,10 @@ def create_order(req):\n def create_order(req):\n     order = validate_order(req.json)\n+    order = apply_coupon(order, req.json.get(\"coupon\"))\n     reserve_stock(order)\n-    charge(order.customer_id, order.total)\n+    order.charge_id = charge(order.customer_id, order.total, idempotency_key=order.id)\n     save_order(order)\n-    return {\"id\": order.id, \"total\": order.total}\n+    return {\"id\": order.id, \"total\": order.total, \"discount\": order.discount}", "callers": [], "risks": ["coupon-500"]}, {"id": "validate_order", "label": "validate_order()", "file": "shop/orders.py", "status": "unchanged"}, {"id": "apply_coupon", "label": "apply_coupon()", "status": "added", "file": "shop/pricing.py", "line": 8, "change": "discounts total by coupon rate, raises InvalidCoupon", "notes": ["Lookup is case-insensitive via upper(); COUPONS has no expiry or usage cap.", "Mutates order.total in place, so everything downstream (stock, charge, response) sees the discounted total. Intended, but worth confirming."], "diff": "@@ -0,0 +1,16 @@\n+COUPONS = {\"WELCOME10\": 0.10, \"VIP25\": 0.25}\n+\n+\n+class InvalidCoupon(Exception):\n+    pass\n+\n+\n+def apply_coupon(order, code: str | None):\n+    if not code:\n+        return order\n+    rate = COUPONS.get(code.upper())\n+    if rate is None:\n+        raise InvalidCoupon(code)\n+    order.discount = round(order.total * rate, 2)\n+    order.total = round(order.total - order.discount, 2)\n+    return order", "callers": [], "risks": ["coupon-500"]}, {"id": "reserve_stock", "label": "reserve_stock()", "file": "shop/inventory.py", "status": "unchanged"}, {"id": "charge", "label": "charge()", "status": "modified", "file": "shop/payments.py", "line": 6, "change": "idempotent on idempotency_key via in-memory _seen", "diff": "@@ -1,5 +1,15 @@\n import gateway\n \n+_seen: dict[str, str] = {}\n \n-def charge(customer_id: str, amount: float) -> str:\n-    return gateway.charge(customer_id, amount)\n+\n+def charge(customer_id: str, amount: float, idempotency_key: str) -> str:\n+    if idempotency_key in _seen:\n+        return _seen[idempotency_key]\n+    charge_id = gateway.charge(customer_id, amount)\n+    _seen[idempotency_key] = charge_id\n+    return charge_id", "callers": [], "risks": ["seen-in-memory"]}, {"id": "gateway_charge", "label": "gateway.charge()", "status": "unchanged", "file": "external"}, {"id": "save_order", "label": "save_order()", "shape": "store", "file": "shop/orders.py", "status": "unchanged", "notes": "Unchanged, but now persists the new discount and charge_id fields because Order is stored whole."}], "edges": [{"from": "create_order", "to": "validate_order"}, {"from": "validate_order", "to": "reserve_stock", "status": "removed"}, {"from": "validate_order", "to": "apply_coupon", "status": "added"}, {"from": "apply_coupon", "to": "reserve_stock", "status": "added"}, {"from": "reserve_stock", "to": "charge", "label": "total, idempotency_key=order.id"}, {"from": "charge", "to": "gateway_charge", "label": "first time only", "risks": ["seen-in-memory"]}, {"from": "charge", "to": "save_order", "label": "charge_id"}], "risks": [{"id": "coupon-500", "severity": "medium", "title": "A bad coupon code returns 500", "detail": "InvalidCoupon is not caught in create_order or in any middleware shown in the diff.", "fix": "Catch InvalidCoupon in create_order and return 400.", "_n": 1}, {"id": "seen-in-memory", "severity": "medium", "title": "Idempotency does not survive a restart", "detail": "_seen is a module-level dict, so it is lost on restart and not shared across replicas. A retry that lands on another process charges twice.", "fix": "Store the key with the order, or pass it to the gateway.", "_n": 2}], "_mermaid": "flowchart TD\n  n0([\"<b>POST /orders \u2192 create_order()<\/b> \u2460<br/><small>applies coupon, stores charge_id, returns discount<\/small>\"]):::modified\n  n1[\"<b>validate_order()<\/b>\"]:::unchanged\n  n2[\"<b>apply_coupon()<\/b> \u2460<br/><small>discounts total by coupon rate, raises InvalidCoupon<\/small>\"]:::added\n  n3[\"<b>reserve_stock()<\/b>\"]:::unchanged\n  n4[\"<b>charge()<\/b> \u2461<br/><small>idempotent on idempotency_key via in-memory _seen<\/small>\"]:::modified\n  n5[\"<b>gateway.charge()<\/b>\"]:::unchanged\n  n6[(\"<b>save_order()<\/b>\")]:::unchanged\n  n0 --> n1\n  n1 -.-> n3\n  n1 ==> n2\n  n2 ==> n3\n  n3 -- \"total, idempotency_key=order.id\" --> n4\n  n4 -- \"first time only \u2461\" --> n5\n  n4 -- \"charge_id\" --> n6", "_ids": {"n0": "create_order", "n1": "validate_order", "n2": "apply_coupon", "n3": "reserve_stock", "n4": "charge", "n5": "gateway_charge", "n6": "save_order"}, "_md": "flowchart TD\n  n0([\"POST /orders \u2192 create_order() \u2460<br/>applies coupon, stores charge_id, returns discount\"]):::modified\n  n1[\"validate_order()\"]:::unchanged\n  n2[\"apply_coupon() \u2460<br/>discounts total by coupon rate, raises InvalidCoupon\"]:::added\n  n3[\"reserve_stock()\"]:::unchanged\n  n4[\"charge() \u2461<br/>idempotent on idempotency_key via in-memory _seen\"]:::modified\n  n5[\"gateway.charge()\"]:::unchanged\n  n6[(\"save_order()\")]:::unchanged\n  n0 --> n1\n  n1 -.-> n3\n  n1 ==> n2\n  n2 ==> n3\n  n3 -- \"total, idempotency_key=order.id\" --> n4\n  n4 -- \"first time only \u2461\" --> n5\n  n4 -- \"charge_id\" --> n6\n  linkStyle 1 stroke:#e11d48,stroke-width:2px\n  linkStyle 2 stroke:#059669,stroke-width:2px\n  linkStyle 3 stroke:#059669,stroke-width:2px\n  classDef added fill:#d1fae5,stroke:#059669,color:#064e3b\n  classDef modified fill:#fef3c7,stroke:#d97706,color:#78350f\n  classDef removed fill:#ffe4e6,stroke:#e11d48,color:#881337,stroke-dasharray:6 4\n  classDef unchanged fill:#f1f5f9,stroke:#64748b,color:#334155"}, {"id": "cancel-order", "title": "Cancel order", "description": "POST /orders/:id/cancel, called from the account page and by support tooling. Promises released stock and a cancelled status. This PR inserts a refund branch between releasing stock and saving the status.", "nodes": [{"id": "cancel_order", "label": "POST /orders/:id/cancel \u2192 cancel_order()", "shape": "entry", "status": "modified", "file": "shop/api.py", "line": 16, "change": "refunds the charge before marking cancelled", "diff": "@@ -16,6 +19,8 @@ def cancel_order(req):\n def cancel_order(req):\n     order = load_order(req.params[\"id\"])\n     release_stock(order)\n+    if order.charge_id:\n+        refund(order.charge_id)\n     order.status = \"cancelled\"\n     save_order(order)\n     return {\"status\": order.status}", "callers": [], "risks": ["refund-after-release"]}, {"id": "load_order", "label": "load_order()", "file": "shop/orders.py", "status": "unchanged", "notes": "Unchanged, but it now returns orders with or without a charge_id.", "risks": ["legacy-no-charge-id"]}, {"id": "release_stock", "label": "release_stock()", "file": "shop/inventory.py", "status": "unchanged"}, {"id": "has_charge", "label": "charge_id set?", "shape": "decision", "status": "added", "file": "shop/api.py", "line": 19}, {"id": "refund", "label": "refund()", "status": "added", "file": "shop/payments.py", "line": 14, "change": "calls gateway.refund(charge_id)", "diff": "@@ -1,5 +1,15 @@\n+def refund(charge_id: str) -> None:\n+    gateway.refund(charge_id)", "callers": [], "risks": ["double-refund"]}, {"id": "gateway_refund", "label": "gateway.refund()", "status": "unchanged", "file": "external", "notes": "gateway is not in this repo. Confirm refund() exists on it; the diff adds the call without touching the gateway module."}, {"id": "save_order", "label": "save_order()", "shape": "store", "file": "shop/orders.py", "status": "unchanged"}], "edges": [{"from": "cancel_order", "to": "load_order"}, {"from": "load_order", "to": "release_stock"}, {"from": "release_stock", "to": "save_order", "status": "removed", "label": "status=cancelled"}, {"from": "release_stock", "to": "has_charge", "status": "added"}, {"from": "has_charge", "to": "refund", "label": "yes", "status": "added"}, {"from": "refund", "to": "gateway_refund", "status": "added"}, {"from": "refund", "to": "save_order", "label": "status=cancelled", "status": "added", "risks": ["refund-after-release"]}, {"from": "has_charge", "to": "save_order", "label": "no", "status": "added", "risks": ["legacy-no-charge-id"]}], "risks": [{"id": "refund-after-release", "severity": "high", "title": "A failed refund leaves stock released and the order uncancelled", "detail": "release_stock runs before refund. If refund raises, the status is never saved: the order stays 'new' with its stock gone.", "fix": "Refund before release_stock, or save the status first.", "_n": 3}, {"id": "legacy-no-charge-id", "severity": "high", "title": "Orders placed before this deploy are cancelled without a refund", "detail": "They have no charge_id, so they take the 'no' branch.", "fix": "Backfill charge_id, or fall back to a gateway lookup.", "_n": 4}, {"id": "double-refund", "severity": "medium", "title": "A retried cancel refunds twice", "detail": "refund() has no idempotency guard, unlike charge().", "fix": "Skip the refund when the order is already cancelled.", "_n": 5}], "_mermaid": "flowchart TD\n  n0([\"<b>POST /orders/:id/cancel \u2192 cancel_order()<\/b> \u2462<br/><small>refunds the charge before marking cancelled<\/small>\"]):::modified\n  n1[\"<b>load_order()<\/b> \u2463\"]:::unchanged\n  n2[\"<b>release_stock()<\/b>\"]:::unchanged\n  n3{\"<b>charge_id set?<\/b>\"}:::added\n  n4[\"<b>refund()<\/b> \u2464<br/><small>calls gateway.refund(charge_id)<\/small>\"]:::added\n  n5[\"<b>gateway.refund()<\/b>\"]:::unchanged\n  n6[(\"<b>save_order()<\/b>\")]:::unchanged\n  n0 --> n1\n  n1 --> n2\n  n2 -. \"status=cancelled\" .-> n6\n  n2 ==> n3\n  n3 == \"yes\" ==> n4\n  n4 ==> n5\n  n4 == \"status=cancelled \u2462\" ==> n6\n  n3 == \"no \u2463\" ==> n6", "_ids": {"n0": "cancel_order", "n1": "load_order", "n2": "release_stock", "n3": "has_charge", "n4": "refund", "n5": "gateway_refund", "n6": "save_order"}, "_md": "flowchart TD\n  n0([\"POST /orders/:id/cancel \u2192 cancel_order() \u2462<br/>refunds the charge before marking cancelled\"]):::modified\n  n1[\"load_order() \u2463\"]:::unchanged\n  n2[\"release_stock()\"]:::unchanged\n  n3{\"charge_id set?\"}:::added\n  n4[\"refund() \u2464<br/>calls gateway.refund(charge_id)\"]:::added\n  n5[\"gateway.refund()\"]:::unchanged\n  n6[(\"save_order()\")]:::unchanged\n  n0 --> n1\n  n1 --> n2\n  n2 -. \"status=cancelled\" .-> n6\n  n2 ==> n3\n  n3 == \"yes\" ==> n4\n  n4 ==> n5\n  n4 == \"status=cancelled \u2462\" ==> n6\n  n3 == \"no \u2463\" ==> n6\n  linkStyle 2 stroke:#e11d48,stroke-width:2px\n  linkStyle 3 stroke:#059669,stroke-width:2px\n  linkStyle 4 stroke:#059669,stroke-width:2px\n  linkStyle 5 stroke:#059669,stroke-width:2px\n  linkStyle 6 stroke:#059669,stroke-width:2px\n  linkStyle 7 stroke:#059669,stroke-width:2px\n  classDef added fill:#d1fae5,stroke:#059669,color:#064e3b\n  classDef modified fill:#fef3c7,stroke:#d97706,color:#78350f\n  classDef removed fill:#ffe4e6,stroke:#e11d48,color:#881337,stroke-dasharray:6 4\n  classDef unchanged fill:#f1f5f9,stroke:#64748b,color:#334155"}], "_files": {"shop/api.py": "from inventory import release_stock, reserve_stock\nfrom orders import load_order, save_order, validate_order\nfrom payments import charge, refund\nfrom pricing import apply_coupon\n\n\ndef create_order(req):\n    order = validate_order(req.json)\n    order = apply_coupon(order, req.json.get(\"coupon\"))\n    reserve_stock(order)\n    order.charge_id = charge(order.customer_id, order.total, idempotency_key=order.id)\n    save_order(order)\n    return {\"id\": order.id, \"total\": order.total, \"discount\": order.discount}\n\n\ndef cancel_order(req):\n    order = load_order(req.params[\"id\"])\n    release_stock(order)\n    if order.charge_id:\n        refund(order.charge_id)\n    order.status = \"cancelled\"\n    save_order(order)\n    return {\"status\": order.status}\n", "shop/pricing.py": "COUPONS = {\"WELCOME10\": 0.10, \"VIP25\": 0.25}\n\n\nclass InvalidCoupon(Exception):\n    pass\n\n\ndef apply_coupon(order, code: str | None):\n    if not code:\n        return order\n    rate = COUPONS.get(code.upper())\n    if rate is None:\n        raise InvalidCoupon(code)\n    order.discount = round(order.total * rate, 2)\n    order.total = round(order.total - order.discount, 2)\n    return order\n", "shop/payments.py": "import gateway\n\n_seen: dict[str, str] = {}\n\n\ndef charge(customer_id: str, amount: float, idempotency_key: str) -> str:\n    if idempotency_key in _seen:\n        return _seen[idempotency_key]\n    charge_id = gateway.charge(customer_id, amount)\n    _seen[idempotency_key] = charge_id\n    return charge_id\n\n\ndef refund(charge_id: str) -> None:\n    gateway.refund(charge_id)\n"}}</script>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@12.3.0/dist/mermaid.esm.min.mjs";
const doc = JSON.parse(document.getElementById("flows").textContent);
const $ = id => document.getElementById(id);
const h = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const isDark = () => document.documentElement.dataset.theme === "dark"; // light unless toggled
let cur = 0;

function initMermaid() {
  mermaid.initialize({ startOnLoad: false, theme: "base", securityLevel: "loose",
    themeVariables: { fontFamily: css("--sans"), fontSize: "13px", primaryTextColor: css("--text"), textColor: css("--muted"), lineColor: css("--arrow"), edgeLabelBackground: css("--mask"), primaryColor: css("--mask"), primaryBorderColor: css("--border") },
    sequence: { mirrorActors: false, useMaxWidth: false },
    flowchart: { htmlLabels: true, curve: "basis", wrappingWidth: 260, padding: 14, nodeSpacing: 40, rankSpacing: 44 } });
  $("theme").textContent = isDark() ? "Light" : "Dark";
}

const SIGN = { added: "+ ", modified: "~ ", removed: "- " };
const changedOf = f => f.nodes.flatMap(n => n.functions || [n]).filter(n => n.status && n.status !== "unchanged");
const listedOf = f => f.nodes.filter(n => (n.status && n.status !== "unchanged") || n.notes); // noted unchanged nodes too
$("eyebrow").textContent = `diff review · ${doc.flows.length} flow${doc.flows.length === 1 ? "" : "s"} · ${doc.flows.reduce((a, f) => a + changedOf(f).length, 0)} changed functions · ${doc.flows.reduce((a, f) => a + (f.risks || []).length, 0)} risks`;
$("title").textContent = doc.title || "Diff flowchart";
$("summary").textContent = doc.summary || "";
$("other").innerHTML = (doc.other || []).map(o => `<li>${h(o)}</li>`).join("");

const tabs = $("tabs");
doc.flows.forEach((f, i) => { const b = document.createElement("button"); b.textContent = f.title; b.onclick = () => show(i); tabs.append(b); });
if (doc.flows.length < 2) tabs.hidden = true;

async function show(i) {
  cur = i;
  [...tabs.children].forEach((b, j) => b.classList.toggle("on", j === i));
  const f = doc.flows[i];
  try {
    const id = `m${i}_${Date.now()}`;
    const { svg } = await mermaid.render(id, f._mermaid);
    $("chart").innerHTML = svg;
    // svg node ids look like <render-id>-flowchart-n3-3; map back to our node
    $("chart").querySelectorAll(".node").forEach(g => { const m = g.id.match(/-(n\d+)-\d+$/); if (m) { g.dataset.mid = m[1]; g.onclick = () => showNode(f.nodes.find(n => n.id === f._ids[m[1]]), m[1]); } });
    // sequence: actor rects carry name=<participant id>; message lines come out in edge order
    $("chart").querySelectorAll("rect.actor[name]").forEach(r => { const mid = r.getAttribute("name"), n = f.nodes.find(n => n.id === f._ids[mid]); if (!n) return; r.dataset.mid = mid; r.classList.add(n.status || "unchanged");
      r.parentElement.querySelectorAll("text.actor tspan").forEach((t, k) => { if (k && n.functions?.[k - 1]) t.classList.add("fn-" + (n.functions[k - 1].status || "unchanged")); }); // line 0 is the component name
      r.onclick = () => showNode(n, mid); });
    // risk numbers arrive as plain circled digits; wrap them so they can be coloured
    const sev = n => doc.flows.flatMap(x => x.risks || []).find(r => r._n === n)?.severity || "high"; // ① is U+2460
    $("chart").querySelectorAll(".messageText, .edgeLabel p, .node span.nodeLabel").forEach(el => { if (/[\u2460-\u2473]/.test(el.textContent)) el.innerHTML = el.innerHTML.replace(/[\u2460-\u2473]/g, m => { const tag = el instanceof SVGElement ? "tspan" : "span"; return `<${tag} class="risk ${sev(m.charCodeAt(0) - 0x245f)}">${m}</${tag}>`; }); });
    $("chart").querySelectorAll(".messageLine0,.messageLine1").forEach((l, j) => l.classList.add("msg-" + (f.edges[j]?.status || "unchanged")));
  } catch (e) {
    document.querySelectorAll("body > div[id^=\"dm\"], body > svg").forEach(el => el.remove()); // mermaid's error bomb
    $("chart").innerHTML = `<pre class="err">${h(e.message || e)}\n\n${h(f._mermaid)}</pre>`;
  }
  showOverview(f);
}

const riskList = rs => rs.length ? `<ol class="risks">${rs.map(r => `<li><span class="rn ${r.severity}">${r._n}</span><span><strong>${h(r.title)}</strong> <small>${r.severity}</small></span>
    ${r.detail ? `<p>${h(r.detail)}</p>` : ""}${r.fix ? `<p class="fix">Fix: ${h(r.fix)}</p>` : ""}</li>`).join("")}</ol>` : "";
const risksOf = x => (doc.flows[cur].risks || []).filter(r => (x.risks || []).includes(r.id));

function showOverview(f) {
  document.querySelectorAll(".sel").forEach(e => e.classList.remove("sel"));
  $("panel").innerHTML = `<div class="card"><h2><i class="dot"></i>${h(f.title)}</h2><p class="hint">${h(f.description || "")}</p>
    <ul class="changed">${listedOf(f).map(n => `<li data-id="${h(n.id)}"><i class="dot ${n.status || "unchanged"}"></i><strong>${h(n.label)}</strong><small>${h(n.functions ? n.functions.map(x => (SIGN[x.status] || "") + x.label).join("  ") : n.change || (n.notes ? "unchanged, see note" : n.status))}</small></li>`).join("")}</ul></div>
    ${f.risks?.length ? `<div class="card"><h2><i class="dot removed"></i>Risks</h2>${riskList(f.risks)}</div>` : ""}`;
  $("panel").querySelectorAll("ul.changed li").forEach(li => li.onclick = () => {
    const n = f.nodes.find(n => n.id === li.dataset.id);
    showNode(n, Object.keys(f._ids).find(m => f._ids[m] === n.id));
  });
}

// unified diff → github-style table. With the file embedded, a click on a hunk header shows the rest of the function.
function mountDiff(el, n) {
  const file = doc._files?.[n.file]?.replace(/\n$/, "").split("\n"), hunks = [];
  for (const l of n.diff.split("\n")) {
    if (l.startsWith("@@")) hunks.push({ head: l, lines: [] });
    else if (l !== "") (hunks.at(-1) || hunks[hunks.push({ head: "", lines: [] }) - 1]).lines.push(l);
  }
  for (const k of hunks) {
    const m = k.head.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)/), want = k.lines.filter(l => l[0] !== "-").map(l => l.slice(1));
    k.o = m ? +m[1] : n.line || 1; k.n = m ? +m[2] : n.line || 1; k.len = want.length; k.up = 0;
    if (!file || !want.length) continue;
    // find the hunk by content: a hunk trimmed to one function often carries stale line numbers
    let best = -1;
    for (let i = 0; i + want.length <= file.length; i++)
      if (want.every((w, j) => file[i + j] === w) && (best < 0 || Math.abs(i + 1 - k.n) < Math.abs(best + 1 - k.n))) best = i;
    if (best >= 0) { k.o += best + 1 - k.n; k.n = best + 1; k.ok = true; }
  }
  const last = hunks.at(-1), end = last?.ok ? last.n + last.len : 0;
  // expansion stops at the function: n.line is its first line, n.end_line its last (guessed from indentation if absent)
  const lo = file && n.line >= 1 ? n.line : Infinity, hi = file && n.line >= 1 ? n.end_line || fnEnd(file, n.line) : 0;
  let down = 0;
  const floor = i => Math.max(lo, i && hunks[i - 1].ok ? hunks[i - 1].n + hunks[i - 1].len : 1); // first hidden line that may be shown above hunk i
  const row = (cls, o, nw, sign, body) => `<tr class="${cls}"><td class="ln">${o}</td><td class="ln">${nw}</td><td class="sign">${sign}</td><td class="code">${h(body)}</td></tr>`;
  const draw = () => {
    let rows = "";
    hunks.forEach((k, i) => {
      const canUp = k.ok && k.n - k.up > floor(i);
      if (k.head || canUp) rows += `<tr class="h${canUp ? " x" : ""}" data-i="${i}"><td colspan="4">${canUp ? "↑ " : ""}${h(k.head || "start of function")}</td></tr>`;
      for (let j = k.n - k.up; k.ok && j < k.n; j++) rows += row("", "", j, "", file[j - 1]); // old numbers are unknown outside the hunk
      let o = k.o, nw = k.n;
      for (const l of k.lines) {
        if (l[0] === "+") rows += row("a", "", nw++, "+", l.slice(1));
        else if (l[0] === "-") rows += row("d", o++, "", "-", l.slice(1));
        else rows += row("", o++, nw++, "", l.slice(1));
      }
    });
    if (end) {
      for (let j = end; j < end + down; j++) rows += row("", "", j, "", file[j - 1]);
      if (end + down <= hi) rows += `<tr class="h x" data-i="down"><td colspan="4">↓ rest of function</td></tr>`;
    }
    el.innerHTML = `<table class="diff">${rows}</table>`;
    el.querySelectorAll("tr.x").forEach(tr => tr.onclick = () => {
      const i = tr.dataset.i;
      if (i === "down") down = hi - end + 1;
      else hunks[i].up = hunks[i].n - floor(+i);
      draw();
    });
  };
  draw();
}
// last line of the block that starts at line `start`: the next line indented no deeper ends it, a closing bracket or `end` belongs to it
// ponytail: indentation guess, fine for formatted code; set end_line in flows.json when it guesses wrong
function fnEnd(file, start) {
  const ind = l => l.match(/^\s*/)[0].length, base = ind(file[start - 1] ?? "");
  let lastCode = start;
  for (let j = start + 1; j <= file.length; j++) {
    const l = file[j - 1];
    if (!l.trim()) continue;
    if (ind(l) < base) break;
    if (ind(l) === base) { if (/^\s*[)\]]/.test(l)) { lastCode = j; continue; } if (/^\s*(\}|end\b)/.test(l)) lastCode = j; break; }
    lastCode = j;
  }
  return lastCode;
}
const diffs = []; // nodes waiting for their diff table to be mounted after the panel html is set
const mountDiffs = () => { $("panel").querySelectorAll("[data-diff]").forEach(el => mountDiff(el, diffs[el.dataset.diff])); diffs.length = 0; };

const detail = n => { const notes = n.notes ? [].concat(n.notes) : []; return `
    <p class="file">${h(n.file || "")}${n.line ? ":" + n.line : ""}</p>
    ${n.change ? `<p class="hint">${h(n.change)}</p>` : ""}
    ${notes.length ? `<div class="notes">${notes.map(x => `<p>${h(x)}</p>`).join("")}</div>` : ""}
    ${riskList(risksOf(n))}
    ${Array.isArray(n.callers) ? `<p class="callers">${n.callers.length ? "Also called from " + n.callers.map(c => `<code>${h(c)}</code>`).join(", ") : "No callers outside this flow."}</p>` : ""}
    ${n.diff ? `<div class="diffwrap" data-diff="${diffs.push(n) - 1}"></div>` : ""}`; };
const pill = s => `<span class="pill ${s || "unchanged"}">${s || "unchanged"}</span>`;

function showNode(n, mid) {
  if (!n) return;
  document.querySelectorAll(".sel").forEach(e => e.classList.remove("sel"));
  document.querySelector(`#chart [data-mid="${mid}"]`)?.classList.add("sel");
  const status = n.status || "unchanged";
  $("panel").innerHTML = `<div class="card"><h2 class="mono"><i class="dot ${status}"></i>${h(n.label)}${pill(status)}</h2>${detail(n)}
    ${(n.functions || []).map(x => `<div class="fn"><h3><i class="dot ${x.status || "unchanged"}"></i>${h((SIGN[x.status] || "") + x.label)}${pill(x.status)}</h3>${detail(x)}</div>`).join("")}
    <a href="#" class="back" id="back">← back to flow</a></div>`;
  mountDiffs();
  $("back").onclick = e => { e.preventDefault(); showOverview(doc.flows[cur]); };
}

$("theme").onclick = () => { document.documentElement.dataset.theme = isDark() ? "light" : "dark"; initMermaid(); show(cur); };
$("copy").onclick = () => navigator.clipboard.writeText(doc.flows[cur]._md).then(() => { $("copy").textContent = "Copied"; setTimeout(() => ($("copy").textContent = "Copy Mermaid"), 1200); });
initMermaid();
show(0);
</script>
